[env:genericSTM32F103C8]
platform = ststm32
board = genericSTM32F103C8
framework = arduino
lib_compat_mode = soft
build_flags =
    -D USBCON
    -D HAL_PCD_MODULE_ENABLED
lib_deps =
    symlink://../../../modmidi-arduino

; MM01 is a shield; its future firmware targets the MM00 STM32F103C8.
; Verify pin mapping and clock/USB behavior before adding firmware or overrides.
; Set upload_protocol only after the programmer or bootloader is confirmed.
; This is configuration only; add firmware under src/ before building.
